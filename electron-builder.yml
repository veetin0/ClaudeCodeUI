appId: dev.harness.app
productName: Harness
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  # The Claude Code binary ships inside platform packages and must run from disk.
  - node_modules/@anthropic-ai/claude-agent-sdk*/**
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
  hardenedRuntime: true
  darkModeSupport: true
